<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动中觉察 · 跳转中…</title>
<style>
  body{margin:0;min-height:100vh;background:#f5efde;color:#1f1d1a;
    font-family:"Noto Serif CJK SC","Songti SC",Georgia,serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:520px;text-align:center}
  h1{font-weight:400;font-size:28px;margin:0 0 12px;letter-spacing:0.1em}
  p{color:#4a4640;line-height:1.7;margin:8px 0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#b3541e;margin:0 3px;animation:b 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
  a{color:#b3541e;text-decoration:none;border-bottom:1px solid #b3541e}
  .err{color:#a83232;background:#fbeaea;border:1px solid #e8c5c5;
    padding:12px;border-radius:6px;margin-top:16px;display:none}
  .ver{font-size:12px;color:#888;margin-top:24px}
</style>
</head>
<body>
<div class="box">
  <h1>动 中 觉 察</h1>
  <p>正在为你定位最新版本…</p>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <div id="err" class="err"></div>
  <p class="ver" id="ver"></p>
</div>

<script>
(async function() {
  const err = document.getElementById('err');
  const verEl = document.getElementById('ver');

  // 当前页面路径，如 /atm-redirector/lesson/l1
  const here = location.pathname;
  // 推断 index.html 所在目录
  // GitHub Pages 仓库部署在 /仓库名/ 子路径下
  // 简单方法：检查这里是什么仓库 / 什么路径
  // 策略：看当前路径有多少 /, 第一段很可能是仓库名
  // 更可靠：从 <link rel="canonical"> 或 favicon 反推
  // 最简单可靠：从 fetch 一个已知相对路径看返回什么
  // 但我们已经知道 index.html 在 /atm-redirector/ 之类
  // 用动态探测：取 path 第一段作为仓库名
  const parts = here.split('/').filter(Boolean);  // ['atm-redirector', 'lesson', 'l1']
  // 仓库名 = 第一个段（GitHub Pages 项目站点）
  // 用户站点（user/org pages）仓库名是空的，这种情况 parts[0] 是路径
  // 区别：pages URL 形如：
  //   项目：/repo-name/path
  //   用户：/path  （无 repo-name）
  // 启发式：如果 parts[0] 不包含 'index' 且存在该 URL = 404 仓库，parts[0] 是仓库名
  // 更简单：探测是否 parts[0] 是仓库（看是否根目录能 GET）
  // 我们直接用 <link rel="canonical"> 试试
  let baseDir = '/';
  if (parts.length >= 2) {
    // 可能是项目仓库（parts[0] 是仓库名）
    // 试探：fetch /parts[0]/ + 'latest.json'，看 200 还是 404
    // 同步不行，异步——所以直接假设
    baseDir = '/' + parts[0] + '/';
  } else if (parts.length === 1) {
    // parts = ['atm-redirector'] 或 ['l1']
    // 看是不是仓库名
    // 默认假设是仓库名
    baseDir = '/' + parts[0] + '/';
  } else {
    baseDir = '/';
  }

  // 计算相对路径 = here - baseDir
  // 例: here="/atm-redirector/lesson/l1", baseDir="/atm-redirector/" → "/lesson/l1"
  let relPath;
  if (baseDir === '/') {
    relPath = here || '/';
  } else {
    relPath = here.substring(baseDir.length - 1);
  }
  if (!relPath.startsWith('/')) relPath = '/' + relPath;
  if (!relPath) relPath = '/';
  relPath = relPath + location.search + location.hash;

  // latest.json 绝对路径（按 origin 算）
  const latestUrl = location.origin + baseDir + 'latest.json';

  // 抓取 latest.json
  let latest;
  try {
    // 调试：打印到 ver
    verEl.textContent = 'latestUrl=' + latestUrl + ' relPath=' + relPath;
    const r = await fetch(latestUrl + (latestUrl.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    latest = await r.json();
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '获取最新版本失败: ' + e.message + '。请稍后再试。';
    console.error(e);
    return;
  }

  if (!latest || !latest.url) {
    err.style.display = 'block';
    err.textContent = 'latest.json 配置异常，缺少 url 字段。';
    return;
  }

  verEl.textContent = '版本 ' + (latest.version || '?') + ' · ' +
    (latest.note || '');

  // 目标 URL
  const target = latest.url.replace(/\/+$/, '') + relPath;

  // 短暂停顿让用户看到过渡，再跳转
  setTimeout(() => { location.replace(target); }, 350);
})();
</script>
</body>
</html>
