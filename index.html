<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<base href="" id="baseTag" />
<title>动中觉察 · 跳转中…</title>
<style>
  body{margin:0;min-height:100vh;background:#f5efde;color:#1f1d1a;
    font-family:"Noto Serif CJK SC","Songti SC",Georgia,serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:520px;text-align:center}
  h1{font-weight:400;font-size:28px;margin:0 0 12px;letter-spacing:0.1em}
  p{color:#4a4640;line-height:1.7;margin:8px 0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#b3541e;margin:0 3px;animation:b 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
  a{color:#b3541e;text-decoration:none;border-bottom:1px solid #b3541e}
  .err{color:#a83232;background:#fbeaea;border:1px solid #e8c5c5;
    padding:12px;border-radius:6px;margin-top:16px;display:none}
  .ver{font-size:12px;color:#888;margin-top:24px}
</style>
</head>
<body>
<div class="box">
  <h1>动 中 觉 察</h1>
  <p>正在为你定位最新版本…</p>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <div id="err" class="err"></div>
  <p class="ver" id="ver"></p>
</div>

<script>
(async function() {
  const err = document.getElementById('err');
  const verEl = document.getElementById('ver');

  // 关键：用 <base> 标签告诉浏览器我们 index.html 在哪
  // 然后计算相对路径
  // 当前 index.html 的 URL → 去掉文件名 → 得到 base 目录
  // 例: https://wcaca.github.io/atm-redirector/lesson/l1
  //     ↑ origin                          ↑ base dir = "/atm-redirector/"
  // 例: https://example.com/lesson/l1
  //     ↑ origin      ↑ base dir = "/"
  const here = location.pathname;
  // 如果 URL 末尾是 /index.html，去掉
  let baseDir;
  if (here.endsWith('/index.html')) {
    baseDir = here.replace(/\/index\.html$/, '/');
  } else if (here.endsWith('/')) {
    baseDir = here;
  } else {
    // 用户访问 /atm-redirector/lesson/l1 → baseDir 应该是 /atm-redirector/
    // 找到最后一段已知路径（GitHub Pages: 仓库名）
    // 启发式：去掉最后一段非文件路径
    baseDir = here.replace(/\/[^/]+\/?$/, '/');
  }
  // 设置 <base> 让 fetch 走相对路径
  document.getElementById('baseTag').href = baseDir;

  // 计算要传给目标站的相对路径
  // baseDir = /atm-redirector/ → 访问 /atm-redirector/lesson/l1 → 相对 = lesson/l1
  // baseDir = /              → 访问 /lesson/l1              → 相对 = lesson/l1
  let relPath = here.substring(baseDir.length - 1);
  // 去掉开头的 /，再加回来
  if (!relPath.startsWith('/')) relPath = '/' + relPath;
  if (relPath === '' || relPath === '/') relPath = '/';
  // 保留 query + hash
  relPath = relPath + location.search + location.hash;

  // 抓取 latest.json（用 <base> 相对路径）
  let latest;
  try {
    const r = await fetch('latest.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    latest = await r.json();
  } catch (e) {
    err.style.display = 'block';
    err.textContent = '获取最新版本失败: ' + e.message + '。请稍后再试。';
    console.error(e);
    return;
  }

  if (!latest || !latest.url) {
    err.style.display = 'block';
    err.textContent = 'latest.json 配置异常，缺少 url 字段。';
    return;
  }

  verEl.textContent = '版本 ' + (latest.version || '?') + ' · ' +
    (latest.note || '');

  // 目标 URL：基础 URL + 相对路径
  const target = latest.url.replace(/\/+$/, '') + relPath;

  // 短暂停顿让用户看到过渡，再跳转
  setTimeout(() => { location.replace(target); }, 350);
})();
</script>
</body>
</html>
